sunshine_name = telephone
# capture de la session TurboVNC :1 (MATE)
capture = x11
output_name = 0
# pas d'encodeur materiel accessible depuis le chroot: x264 logiciel, reglage faible latence
sw_preset = ultrafast
sw_tune = zerolatency
min_threads = 4
# reseau
address_family = ipv4
upnp = disabled
origin_web_ui_allowed = lan
global_prep_cmd = [{"do":"/usr/local/bin/sunshine-resize.sh do","undo":"/usr/local/bin/sunshine-resize.sh undo"}]
